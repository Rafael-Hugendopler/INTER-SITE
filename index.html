
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="ico.sc.png" type="image/x-icon">
    <link rel="stylesheet" href="style2.css">

    <title>Login - Internacional</title>
</head>

<body>

    <!-- CABEÇALHO -->

    <div class="faixa">

        <img src="inter.img.png" alt="Escudo do Internacional">

        <h1>
            <span>SPORT CLUB</span><br>
            INTERNACIONAL
        </h1>

    </div>


    <!-- ÁREA DE LOGIN -->

    <main>

        <form action="index2.html" method="get">
            <div class="login">
                <img src="inter.img.png" alt="Escudo do Internacional" class="logo-login">
                <h2>ACESSE SUA CONTA</h2>
                <p class="subtitulo">
                    Entre para continuar
                </p>
                <!-- USUÁRIO -->
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>
                <!-- SENHA -->
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>
                <!-- ESQUECI A SENHA -->
                <a href="#" class="esqueci">
                    Esqueci minha senha
                </a>
                <!-- BOTÃO -->
                <a href="index.html">
                    <button class="entrar">
                        ENTRAR
                    </button>
            
                <!-- CADASTRO -->
                <p class="cadastro">
                    Ainda não possui uma conta?
                    <a href="#">Cadastre-se</a>
                </p>
            </div>
        </form>

    </main>

</body>

</html>
